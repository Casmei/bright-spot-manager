# Só o banco, para desenvolver com `bun dev`: docker compose -f docker-compose.dev.yml up -d
# Nome de projeto próprio: assim ele não substitui o container `db` do docker-compose.yml.
name: almenara-vigia-dev

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: vigia
      POSTGRES_PASSWORD: vigia
      POSTGRES_DB: vigia
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vigia -d vigia"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata-dev:/var/lib/postgresql/data

volumes:
  pgdata-dev:
    name: bright-spot-manager_pgdata-dev
