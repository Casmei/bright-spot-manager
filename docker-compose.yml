# Produção: `docker compose up -d --build` sobe o banco e o app.
# Variáveis vêm do ambiente ou de um .env ao lado deste arquivo (no Coolify, da aba Environment Variables).
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vigia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-vigia}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build:
      context: .
      args:
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-vigia}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-vigia}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      AFFECTED_IP_SECRET: ${AFFECTED_IP_SECRET:?defina AFFECTED_IP_SECRET}
      AFFECTED_MAX_PER_IP: ${AFFECTED_MAX_PER_IP:-3}
    ports:
      - "${APP_PORT:-3000}:3000"

volumes:
  pgdata:
