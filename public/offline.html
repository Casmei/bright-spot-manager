<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />

    <meta name="theme-color" content="#a91518" />
    <title>Sem conexão — Almenara Vigia</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
        box-sizing: border-box;
        font-family: system-ui, sans-serif;
        background: #fbf8f7;
        color: #1f1a19;
        text-align: center;
      }
      img { width: 72px; height: 72px; border-radius: 16px; }

      button {
        font: inherit;
        font-weight: 600;
        padding: 10px 20px;
        border: 0;
        border-radius: 8px;
        background: #a91518;
        color: #fff;
      }

  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>Você está sem conexão</h1>
      <p>Conecte-se à internet para ver e enviar denúncias.</p>
      <button onclick="location.reload()">Tentar de novo</button>
